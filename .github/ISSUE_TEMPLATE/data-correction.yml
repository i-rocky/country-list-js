name: Data correction
description: A country's details are wrong or out of date
labels: [data]
body:
  - type: markdown
    attributes:
      value: |
        Data lives in `countries/<ISO2>.json`, one file per country — a fix is
        usually a one-line pull request, and those are very welcome.
  - type: input
    id: country
    attributes:
      label: Country
      description: ISO 3166-1 alpha-2 code, or the name
      placeholder: BG
    validations: {required: true}
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong, and what should it be?
      placeholder: currency is BGN; Bulgaria adopted the euro on 2026-01-01
    validations: {required: true}
  - type: input
    id: source
    attributes:
      label: Source
      description: Something we can check it against
    validations: {required: true}
